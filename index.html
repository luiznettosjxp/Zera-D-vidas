<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080B">
<title>Zera Dívidas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080B;--card:rgba(255,255,255,.035);--ink:#F2F5F8;--mute:#8793A0;--line:rgba(255,255,255,.14);--ac:#6CC4FF;--acs:rgba(108,196,255,.08);--bad:#FF6B63;--bads:rgba(255,107,99,.08);--warn:#E8B04A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F7F9;--card:#fff;--ink:#0B0E12;--mute:#667381;--line:rgba(10,14,18,.14);--ac:#0B6FC2;--acs:rgba(11,111,194,.06);--bad:#C42E27;--bads:rgba(196,46,39,.06)}}
:root[data-theme="light"]{--bg:#F6F7F9;--card:#fff;--ink:#0B0E12;--mute:#667381;--line:rgba(10,14,18,.14);--ac:#0B6FC2;--acs:rgba(11,111,194,.06);--bad:#C42E27;--bads:rgba(196,46,39,.06)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:88px;
background-image:radial-gradient(ellipse 80% 40% at 50% -10%,var(--acs),transparent 70%);background-repeat:no-repeat}
main{max-width:560px;margin:0 auto;padding:22px 20px}
h1{font:200 38px/1.05 Barlow,system-ui,sans-serif;letter-spacing:-.5px;margin:18px 0 26px}
h2{font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:34px 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px 18px;margin-bottom:14px;backdrop-filter:blur(6px)}
.m{color:var(--mute);font-size:14px;font-weight:300}
.c>.m:first-child{font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}
.big{font-size:56px;font-weight:200;letter-spacing:-2px;line-height:1}
.ok{color:var(--ac)}.bad{color:var(--bad)}
b{font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.bar{display:flex;gap:2px;height:3px;background:var(--line);margin:22px 0 14px}
.bar i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.lg b{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:0}
label{display:block;font:500 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:18px 0 6px}
input,select{width:100%;font:300 18px Barlow,system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;appearance:none}
select option{background:#10151B;color:#F2F5F8}
input:focus,select:focus{outline:0;border-bottom-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input::placeholder{color:var(--mute);opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:24px;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:14px;font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.24em;text-transform:uppercase;transition:background .15s,color .15s}
.btn:hover,.btn:active{background:var(--ink);color:var(--bg)}
.x{background:none;border:0;color:var(--mute);font-size:20px;padding:2px 0 2px 14px;font-weight:200}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;color:var(--mute);padding:17px 2px 15px;font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase}
nav button.on{color:var(--ink);border-top-color:var(--ac)}
.tip{border-left:1px solid var(--ac);padding:4px 0 4px 16px;margin:16px 0;font-size:16px;color:var(--ink)}
.tip.w{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:11px 0;border-top:1px solid var(--line);text-align:right}
th{font:500 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);border-top:0}
td:first-child,th:first-child{text-align:left}
p.m{margin-top:24px}

textarea{width:100%;font:300 14px Barlow,system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px;min-height:64px;margin-top:12px}
textarea:focus{outline:0;border-color:var(--ac)}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 20%,var(--acs),transparent 40%),radial-gradient(circle at 75% 80%,var(--acs),transparent 38%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 26px var(--ac)}}
.in>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.in .bar i{transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .35s both}
.in .row{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 150ms)}
.big.ok{animation:glow 4s ease-in-out infinite}
.c{transition:border-color .3s,transform .3s}
.c:hover{border-color:var(--ac)}
nav button{transition:color .25s,border-color .25s}
.btn:active{transform:scale(.98)}
.x{transition:color .2s,transform .2s}.x:hover{color:var(--bad);transform:rotate(90deg)}
.tip{transition:padding-left .3s}.tip:hover{padding-left:22px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K='zera_dividas_v1';
let S={renda:0,extra:0,desp:[],card:[],loan:[]};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'))||0;
const T=id=>document.getElementById(id).value.trim();
let tab='res',last='';
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const tabs=[['res','','Resumo'],['gas','','Gastos'],['div','','Dívidas'],['pla','','Plano']];
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fixed=()=>sum(S.desp,d=>d.v);
const cards=()=>sum(S.card,c=>c.v);
const parc=()=>sum(S.loan,l=>l.p);
const total=()=>fixed()+cards()+parc();

function sim(ex){
  const D=[...S.card.map(c=>({n:c.n,b:c.v,r:c.j,card:1})),...S.loan.map(l=>({n:l.n,b:l.s>0?l.s:l.p*l.q,r:l.j,m:l.p}))].filter(d=>d.b>0);
  const B=S.renda-fixed()+ex;
  const mins=sum(D,d=>d.card?Math.max(d.b*.15,Math.min(50,d.b)):Math.min(d.b,d.m));
  let months=0,int=0;
  while(D.some(d=>d.b>.01)&&months<360){
    months++;let left=B;
    D.forEach(d=>{if(d.b<=.01)return;const i=d.b*d.r/100;d.b+=i;int+=i;
      const m=d.card?Math.max(d.b*.15,Math.min(50,d.b)):d.m;const p=Math.min(d.b,m);d.b-=p;left-=p;});
    if(left>0)D.filter(d=>d.b>.01).sort((a,b)=>b.r-a.r).forEach(d=>{const p=Math.min(d.b,left);d.b-=p;left-=p;});
    D.forEach(d=>{if(d.b<=.01&&!d.done)d.done=months});
  }
  return{months,int,B,mins,deficit:B<mins-.01,ok:months<360&&B>=mins-.01,D,none:D.length===0};
}
function when(m){const d=new Date();d.setMonth(d.getMonth()+m);return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}

function view(){
  const a=document.getElementById('app');
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';view();scrollTo(0,0)">${t[2]}</button>`).join('');
  a.innerHTML=({res:vRes,gas:vGas,div:vDiv,pla:vPla})[tab]();
  const fresh=tab!==last;last=tab;a.classList.toggle('in',fresh);
  if(fresh){[...a.children].forEach((e,i)=>e.style.setProperty('--i',i));count(a)}
}
function count(a){a.querySelectorAll('[data-n],[data-t]').forEach(el=>{const m=el.dataset.n!==undefined,v=+(m?el.dataset.n:el.dataset.t);const f=x=>m?R(x):'T−'+Math.round(x);const t0=performance.now();const st=n=>{const k=Math.min(1,(n-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=f(v*e);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
const msg=t=>{const e=document.getElementById('bkm');if(e)e.textContent=t};
async function bk(){const j=JSON.stringify(S);try{await navigator.clipboard.writeText(j);msg('Backup copiado. Cole em suas notas ou envie para você mesmo.')}catch(e){document.getElementById('bkt').value=j;msg('Copie o texto do campo acima.')}}
function rs(){try{const o=JSON.parse(T('bkt'));if(!Array.isArray(o.desp))throw 0;S=Object.assign({renda:0,extra:0,desp:[],card:[],loan:[]},o);save();view();}catch(e){msg('Backup inválido. Cole o texto completo.')}}

function vRes(){
  const t=total(),sob=S.renda-t,f=fixed(),c=cards(),p=parc();
  const w=v=>t>0?(v/Math.max(t,S.renda)*100).toFixed(1):0;
  return `<h1>Resumo do mês</h1>
  <div class="c"><div class="m">Gasto previsto até o fim do mês</div><div class="big" data-n="${t}">${R(t)}</div>
  <div class="bar"><i style="width:${w(f)}%;background:var(--ink)"></i><i style="width:${w(c)}%;background:var(--ac)"></i><i style="width:${w(p)}%;background:var(--mute)"></i></div>
  <div class="lg"><span><b style="background:var(--ink)"></b>Despesas ${R(f)}</span><span><b style="background:var(--ac)"></b>Cartões ${R(c)}</span><span><b style="background:var(--mute)"></b>Empréstimos ${R(p)}</span></div></div>
  <div class="c"><label for="renda" style="margin-top:0">Renda mensal líquida (R$)</label>
  <input id="renda" inputmode="decimal" value="${S.renda||''}" placeholder="0,00" onchange="S.renda=N('renda');save();view()">
  <div class="row" style="margin-top:10px"><span>Sobra (ou falta) no fim do mês</span><b class="${sob>=0?'ok':'bad'}">${R(sob)}</b></div>
  <div class="row"><span class="m">Comprometimento da renda</span><b>${S.renda>0?Math.round(t/S.renda*100)+'%':'–'}</b></div></div>
  ${S.renda>0&&sob<0?`<div class="tip w">Você vai fechar o mês com <b>${R(-sob)}</b> a menos do que precisa. Veja o plano para saber o que cortar ou renegociar.</div>`:''}
  ${t===0?`<div class="tip">Comece cadastrando suas despesas em <b>Gastos</b> e suas faturas e empréstimos em <b>Dívidas</b>.</div>`:''}
  <button class="btn" onclick="tab='pla';view()">Ver plano para zerar as dívidas</button>
  <h2>Backup dos dados</h2>
  <div class="c"><div class="m" style="text-transform:none;letter-spacing:0;font:300 14px Barlow,sans-serif">Seus dados ficam salvos neste aparelho. Copie um backup para não perder se limpar o navegador ou trocar de celular.</div>
  <textarea id="bkt" placeholder="Cole aqui um backup para restaurar"></textarea>
  <div class="g2"><button class="btn" onclick="bk()">Copiar backup</button><button class="btn" onclick="rs()">Restaurar</button></div>
  <div class="m" id="bkm" style="margin-top:12px"></div></div>`;
}

function vGas(){
  return `<h1>Despesas do mês</h1>
  <div class="c">${S.desp.length?S.desp.map((d,i)=>`<div class="row"><div>${d.n}<div class="m">${d.t==='f'?'Fixa':'Variável'}</div></div><div><b>${R(d.v)}</b><button class="x" aria-label="Remover" onclick="S.desp.splice(${i},1);save();view()">×</button></div></div>`).join('')+`<div class="row"><b>Total</b><b>${R(fixed())}</b></div>`:'<div class="m">Nenhuma despesa ainda. Adicione aluguel, mercado, luz, transporte…</div>'}</div>
  <div class="c"><label for="dn" style="margin-top:0">Nome</label><input id="dn" placeholder="Ex.: Aluguel">
  <div class="g2"><div><label for="dv">Valor (R$)</label><input id="dv" inputmode="decimal" placeholder="0,00"></div>
  <div><label for="dt">Tipo</label><select id="dt"><option value="f">Fixa</option><option value="v">Variável</option></select></div></div>
  <button class="btn" onclick="addD()">Adicionar despesa</button></div>`;
}
function addD(){const n=T('dn'),v=N('dv');if(!n||v<=0)return;S.desp.push({n,v,t:document.getElementById('dt').value});save();view()}

function vDiv(){
  return `<h1>Cartões e empréstimos</h1>
  <h2>Cartões de crédito</h2>
  <div class="c">${S.card.length?S.card.map((c,i)=>`<div class="row"><div>${c.n}<div class="m">juros ${c.j}% ao mês</div></div><div><b>${R(c.v)}</b><button class="x" aria-label="Remover" onclick="S.card.splice(${i},1);save();view()">×</button></div></div>`).join(''):'<div class="m">Nenhum cartão cadastrado.</div>'}
  <label for="cn">Nome do cartão</label><input id="cn" placeholder="Ex.: Nubank">
  <div class="g2"><div><label for="cv">Fatura atual (R$)</label><input id="cv" inputmode="decimal" placeholder="0,00"></div>
  <div><label for="cj">Juros rotativo (% mês)</label><input id="cj" inputmode="decimal" value="14"></div></div>
  <button class="btn" onclick="addC()">Adicionar cartão</button></div>
  <h2>Empréstimos e financiamentos</h2>
  <div class="c">${S.loan.length?S.loan.map((l,i)=>`<div class="row"><div>${l.n}<div class="m">${l.q} parcelas · juros ${l.j}% ao mês${l.s>0?' · saldo '+R(l.s):''}</div></div><div><b>${R(l.p)}</b><button class="x" aria-label="Remover" onclick="S.loan.splice(${i},1);save();view()">×</button></div></div>`).join(''):'<div class="m">Nenhum empréstimo cadastrado.</div>'}
  <label for="ln">Nome</label><input id="ln" placeholder="Ex.: Empréstimo pessoal">
  <div class="g2"><div><label for="lp">Parcela mensal (R$)</label><input id="lp" inputmode="decimal" placeholder="0,00"></div>
  <div><label for="lq">Parcelas restantes</label><input id="lq" inputmode="numeric" placeholder="12"></div>
  <div><label for="lj">Juros (% mês)</label><input id="lj" inputmode="decimal" value="4"></div>
  <div><label for="ls">Saldo devedor (opcional)</label><input id="ls" inputmode="decimal" placeholder="0,00"></div></div>
  <button class="btn" onclick="addL()">Adicionar empréstimo</button></div>`;
}
function addC(){const n=T('cn'),v=N('cv'),j=N('cj');if(!n||v<=0)return;S.card.push({n,v,j});save();view()}
function addL(){const n=T('ln'),p=N('lp'),q=Math.round(N('lq')),j=N('lj'),s=N('ls');if(!n||p<=0||q<=0)return;S.loan.push({n,p,q,j,s});save();view()}

function vPla(){
  if(!S.card.length&&!S.loan.length)return `<h1>Plano para zerar</h1><div class="tip">Cadastre ao menos um cartão ou empréstimo em <b>Dívidas</b> para ver o plano.</div>`;
  const ex=S.extra||0,r=sim(ex),debts=[...r.D].sort((a,b)=>b.r-a.r);
  const tips=[];
  const worst=debts[0];
  if(S.renda<=0)tips.push(['w','Informe sua renda no Resumo para o plano calcular com precisão.']);
  if(r.deficit)tips.push(['w',`Seus pagamentos mínimos (${R(r.mins)}) passam do que sobra após as despesas (${R(r.B)}). Corte gastos variáveis ou renegocie as dívidas antes de qualquer outra coisa.`]);
  if(worst)tips.push(['',`Concentre qualquer dinheiro extra em <b>${worst.n}</b> (${worst.r}% ao mês), a dívida mais cara. Pague só o mínimo nas outras. Ao quitar, passe o valor para a próxima.`]);
  if(S.card.some(c=>c.j>=8))tips.push(['w','Nunca deixe fatura no rotativo. Se não conseguir pagar tudo, troque a dívida do cartão por um empréstimo ou parcelamento com juros bem menores.']);
  const varD=S.desp.filter(d=>d.t==='v');const vs=sum(varD,d=>d.v);
  if(vs>0)tips.push(['',`Cortar 20% das despesas variáveis libera <b>${R(vs*.2)}</b> por mês para as dívidas.`]);
  const big=[...S.loan].sort((a,b)=>b.j-a.j)[0];
  if(big&&big.j>=3)tips.push(['',`Peça portabilidade do <b>${big.n}</b> para outro banco com taxa menor e renegocie o saldo. Em feirões de renegociação os descontos podem ser altos.`]);
  tips.push(['','Venda itens parados e use renda extra pontual para amortizar o saldo. Antecipar parcelas reduz os juros futuros.']);
  tips.push(['','Evite novas compras no cartão até zerar. Pague a fatura inteira todo mês.']);
  const ext=[0,100,300,500].map(e=>[e,sim(e)]);
  return `<h1>Plano para zerar</h1>
  <div class="c"><div class="m">${r.ok?'Contagem regressiva':'Com a sua renda atual'}</div>
  ${r.ok?`<div class="big ok" data-t="${r.months}">T−${r.months}</div><div class="m" style="margin-top:6px">${r.months===1?'mês':'meses'} para dívida zero</div><div class="m">${when(r.months)} · juros totais estimados ${R(r.int)}</div>`:`<div class="big bad">Não fecha</div><div class="m">${r.deficit?'O orçamento não cobre os pagamentos mínimos.':'Mais de 30 anos para quitar nesse ritmo.'}</div>`}
  <label for="ex">Valor extra por mês para as dívidas (R$)</label>
  <input id="ex" inputmode="decimal" value="${ex||''}" placeholder="0,00" onchange="S.extra=N('ex');save();view()">
  <div class="row" style="margin-top:10px"><span class="m">Disponível por mês para dívidas</span><b>${R(r.B)}</b></div></div>
  <h2>Ordem de pagamento</h2>
  <div class="c">${debts.map((d,i)=>`<div class="row"><div>${i+1}. ${d.n}<div class="m">juros ${d.r}% ao mês</div></div><b>${d.done?'quita em '+d.done+(d.done===1?' mês':' meses'):'não quita'}</b></div>`).join('')}</div>
  <h2>O que fazer</h2>
  ${tips.map(t=>`<div class="tip ${t[0]}">${t[1]}</div>`).join('')}
  <h2>E se eu pagar mais por mês?</h2>
  <div class="c"><table><tr><th>Extra</th><th>Prazo</th><th>Juros</th></tr>${ext.map(([e,x])=>`<tr><td>+${R(e)}</td><td>${x.ok?x.months+' meses':'não fecha'}</td><td>${x.ok?R(x.int):'–'}</td></tr>`).join('')}</table></div>
  <p class="m">Estimativa simples: considera mínimo de 15% da fatura nos cartões e as parcelas dos empréstimos. Não substitui orientação financeira.</p>`;
}
view();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
