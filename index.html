<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080B">
<title>Zera Dívidas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080B;--card:rgba(255,255,255,.035);--ink:#F2F5F8;--mute:#8793A0;--line:rgba(255,255,255,.14);--ac:#6CC4FF;--acs:rgba(108,196,255,.08);--bad:#FF6B63;--bads:rgba(255,107,99,.08);--warn:#E8B04A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F7F9;--card:#fff;--ink:#0B0E12;--mute:#667381;--line:rgba(10,14,18,.14);--ac:#0B6FC2;--acs:rgba(11,111,194,.06);--bad:#C42E27;--bads:rgba(196,46,39,.06)}}
:root[data-theme="light"]{--bg:#F6F7F9;--card:#fff;--ink:#0B0E12;--mute:#667381;--line:rgba(10,14,18,.14);--ac:#0B6FC2;--acs:rgba(11,111,194,.06);--bad:#C42E27;--bads:rgba(196,46,39,.06)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:88px;
background-image:radial-gradient(ellipse 80% 40% at 50% -10%,var(--acs),transparent 70%);background-repeat:no-repeat}
main{max-width:560px;margin:0 auto;padding:22px 20px}
h1{font:200 38px/1.05 Barlow,system-ui,sans-serif;letter-spacing:-.5px;margin:18px 0 26px}
h2{font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:34px 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px 18px;margin-bottom:14px;backdrop-filter:blur(6px)}
.m{color:var(--mute);font-size:14px;font-weight:300}
.c>.m:first-child{font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px}
.big{font-size:56px;font-weight:200;letter-spacing:-2px;line-height:1}
.ok{color:var(--ac)}.bad{color:var(--bad)}
b{font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.bar{display:flex;gap:2px;height:3px;background:var(--line);margin:22px 0 14px}
.bar i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.lg b{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:0}
label{display:block;font:500 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:18px 0 6px}
input,select{width:100%;font:300 18px Barlow,system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;appearance:none}
select option{background:var(--bg);color:var(--ink)}
input[type=month]{min-height:42px}
body{transition:background-color .5s,color .5s}
#th{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;backdrop-filter:blur(8px);transition:transform .5s,border-color .3s}
#th:hover{border-color:var(--ac)}#th.sp{transform:rotate(360deg)}
.off{opacity:.45}
.x.ed{font-size:15px}.x.ed:hover{color:var(--ac);transform:none}
details.bk{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;opacity:.6;transition:opacity .3s}
details.bk[open],details.bk:hover{opacity:1}
details.bk summary{cursor:pointer;color:var(--mute);font:500 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;list-style:none}
details.bk summary::-webkit-details-marker{display:none}
details.bk summary::after{content:" +"}details.bk[open] summary::after{content:" −"}
input:focus,select:focus{outline:0;border-bottom-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input::placeholder{color:var(--mute);opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:24px;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:14px;font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.24em;text-transform:uppercase;transition:background .15s,color .15s}
.btn:hover,.btn:active{background:var(--ink);color:var(--bg)}
.x{background:none;border:0;color:var(--mute);font-size:20px;padding:2px 0 2px 14px;font-weight:200}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;color:var(--mute);padding:17px 0 15px;font:500 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase}
nav button.on{color:var(--ink);border-top-color:var(--ac)}
.tip{border-left:1px solid var(--ac);padding:4px 0 4px 16px;margin:16px 0;font-size:16px;color:var(--ink)}
.tip.w{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:11px 0;border-top:1px solid var(--line);text-align:right}
th{font:500 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);border-top:0}
td:first-child,th:first-child{text-align:left}
p.m{margin-top:24px}

textarea{width:100%;font:300 14px Barlow,system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px;min-height:64px;margin-top:12px}
textarea:focus{outline:0;border-color:var(--ac)}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 20%,var(--acs),transparent 40%),radial-gradient(circle at 75% 80%,var(--acs),transparent 38%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 26px var(--ac)}}
.in>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.in .bar i{transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .35s both}
.in .row{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 150ms)}
.big.ok{animation:glow 4s ease-in-out infinite}
.c{transition:border-color .3s,transform .3s}
.c:hover{border-color:var(--ac)}
nav button{transition:color .25s,border-color .25s}
.btn:active{transform:scale(.98)}
.x{transition:color .2s,transform .2s}.x:hover{color:var(--bad);transform:rotate(90deg)}
.tip{transition:padding-left .3s}.tip:hover{padding-left:22px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<button id="th" aria-label="Alternar modo noturno" onclick="togTheme()"></button>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K='zera_dividas_v1';
const DEF=()=>({renda:0,diaRec:0,extra:0,theme:'auto',desp:[],card:[],loan:[],ext:[],par:[]});let S=DEF();
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
function fixIds(){S.card.forEach((c,i)=>{if(!c.id)c.id='c'+i});if(!Array.isArray(S.par))S.par=[];
  const old=S.par.filter(x=>!x.m&&x.p&&x.q);if(old.length){S.par=S.par.filter(x=>x.m);
   old.forEach(x=>{for(let o=1;o<=x.q;o++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);S.par.push({k:x.k,m:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),v:x.p})}})}}
fixIds();
const saveQ=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{S.upd=Math.max(Date.now(),(S.upd||0)+1);saveQ();qs()};
/* ---- Sincronização entre aparelhos (gist privado do GitHub) ---- */
const SK='zera_sync',FN='zera_dividas.json';
let Y={tok:'',gid:'',at:0};try{Object.assign(Y,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
const saveY=()=>{try{localStorage.setItem(SK,JSON.stringify(Y))}catch(e){}};
let busy=false,again=false,pt=null,sm='';
const setSM=t=>{sm=t;const e=document.getElementById('sym');if(e)e.textContent=t};
const gh=async(p,o={})=>{const r=await fetch('https://api.github.com'+p,{cache:'no-store',...o,headers:{Authorization:'Bearer '+Y.tok,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok)throw new Error(String(r.status));return r.json()};
const pay=()=>{const o={...S};delete o.theme;return JSON.stringify(o)};
const hasData=()=>S.renda>0||S.desp.length||S.card.length||S.loan.length||S.ext.length;
function qs(){if(!Y.tok)return;clearTimeout(pt);pt=setTimeout(()=>sync(),1500)}
async function findG(){for(let pg=1;pg<=5;pg++){const L=await gh('/gists?per_page=100&page='+pg);const g=L.find(x=>x.files&&x.files[FN]);if(g)return g.id;if(L.length<100)break}return ''}
async function getR(){const g=await gh('/gists/'+Y.gid);const f=g.files&&g.files[FN];if(!f)return null;let t=f.content;if(f.truncated||t==null)t=await(await fetch(f.raw_url,{cache:'no-store'})).text();return JSON.parse(t)}
const putR=()=>gh('/gists/'+Y.gid,{method:'PATCH',body:JSON.stringify({files:{[FN]:{content:pay()}}})});
function applyR(r){const th=S.theme;S=Object.assign(DEF(),r);S.theme=th;fixIds();saveQ();E=null}
async function sync(man){
  if(!Y.tok)return;if(busy){again=true;return}
  busy=true;setSM('Sincronizando…');
  try{
    if(!Y.gid){Y.gid=await findG();saveY()}
    if(!Y.gid){const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Zera Dívidas',public:false,files:{[FN]:{content:pay()}}})});Y.gid=g.id;saveY()}
    else{const r=await getR();
      if(r&&(r.upd||0)>(S.upd||0)){if(!man&&/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){busy=false;return}applyR(r);view()}
      else if(!r||(S.upd||0)>(r.upd||0))await putR()}
    Y.at=Date.now();saveY();setSM('Sincronizado às '+new Date(Y.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSM(e.message==='401'?'Token inválido ou sem permissão de gist.':'Sem conexão. Tente de novo depois.')}
  busy=false;if(again){again=false;sync()}
}
async function conn(){
  const t=T('syt');if(!t){setSM('Cole o token primeiro.');return}
  Y={tok:t,gid:'',at:0};saveY();setSM('Conectando…');
  try{
    Y.gid=await findG();saveY();
    if(Y.gid){const r=await getR();
      if(r&&(!hasData()||confirm('Já existe uma base na nuvem.\n\nOK = baixar a base da nuvem e SUBSTITUIR os dados deste aparelho.\nCancelar = enviar os dados deste aparelho e SUBSTITUIR a nuvem.')))applyR(r);
      else{S.upd=Date.now();saveQ()}
    }else if(!S.upd){S.upd=Date.now();saveQ()}
  }catch(e){Y={tok:'',gid:'',at:0};saveY();setSM(e.message==='401'?'Token inválido ou sem permissão de gist.':'Não consegui conectar. Confira o token e a internet.');return}
  await sync();view();
}
function disc(){Y={tok:'',gid:'',at:0};sm='';saveY();view()}
addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('online',()=>sync());addEventListener('focus',()=>sync());addEventListener('pageshow',()=>sync());
setInterval(()=>{if(!document.hidden)sync()},15000);
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'))||0;
const T=id=>document.getElementById(id).value.trim();
let tab='res',last='';
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const tabs=[['res','','Resumo'],['gas','','Gastos'],['ext','','Extras'],['div','','Dívidas'],['pla','','Plano']];
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fm2=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NM=id=>parseFloat(document.getElementById(id).value.replace(/\./g,'').replace(',','.'))||0;
const esc=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('money')){const n=parseInt(t.value.replace(/\D/g,'')||'0',10);t.value=n?fm2(n/100):''}});
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mp(id,val,opt){const[y,m]=(val||'').split('-');const y0=new Date().getFullYear(),a0=Math.min(y0,+y||y0);
 return `<div class="g2"><select id="${id}m" aria-label="Mês">${opt?'<option value="">—</option>':''}${MES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===m?'selected':''}>${n}</option>`}).join('')}</select><select id="${id}y" aria-label="Ano">${opt?'<option value="">—</option>':''}${Array.from({length:y0-a0+12},(_,i)=>a0+i).map(a=>`<option ${String(a)===y?'selected':''}>${a}</option>`).join('')}</select></div>`}
const gp=id=>{const m=document.getElementById(id+'m').value,y=document.getElementById(id+'y').value;return m&&y?y+'-'+m:''};
let E=null;
const ed=k=>E&&E.k===k?S[k][E.i]:null;
function edit(k,i){E={k,i};view();setTimeout(()=>{const f=document.getElementById('f-'+k);if(f)f.scrollIntoView({behavior:'smooth',block:'center'})},60)}
function put(k,o){if(E&&E.k===k)S[k][E.i]=o;else S[k].push(o);E=null;save();view()}
const btns=(k,add)=>`<button class="btn" onclick="${({desp:'addD',ext:'addE',card:'addC',loan:'addL',par:'addP'})[k]}()">${ed(k)?'Salvar alteração':add}</button>${ed(k)?'<button class="btn" style="margin-top:10px" onclick="E=null;view()">Cancelar</button>':''}`;
const ttl=(k,a,b)=>`<div class="m">${ed(k)?a:b}</div>`;
const ebtn=(k,i)=>`<button class="x ed" aria-label="Editar" onclick="edit('${k}',${i})">✎</button>`;
const ym=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fm=s=>{const[y,m]=s.split('-');return new Date(+y,m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).replace('.','')};
const act=(d,o)=>!d.ate||d.ate>=ym(o);
const fixed=(o=0)=>sum(S.desp.filter(d=>act(d,o)),d=>d.v);
const extraIn=(o=0)=>sum(S.ext.filter(e=>e.m===ym(o)),e=>e.v);
const isDark=()=>!(S.theme==='light'||(S.theme!=='dark'&&matchMedia('(prefers-color-scheme: light)').matches));
function applyTheme(){const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.dataset.theme=S.theme;else delete r.dataset.theme;const d=isDark();r.style.colorScheme=d?'dark':'light';const b=document.getElementById('th');if(b)b.textContent=d?'☀':'☾';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#06080B':'#F6F7F9'}
function togTheme(){S.theme=isDark()?'light':'dark';saveQ();applyTheme();const b=document.getElementById('th');b.classList.add('sp');setTimeout(()=>b.classList.remove('sp'),500)}
const DD=id=>{const n=Math.round(N(id));return n>=1&&n<=31?n:0};
const dayIn=v=>v?`value="${v}"`:'';
function nxt(day){const t=new Date();t.setHours(0,0,0,0);const mk=(y,m)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));let d=mk(t.getFullYear(),t.getMonth());if(d<t)d=mk(t.getFullYear(),t.getMonth()+1);return{d,n:Math.round((d-t)/864e5)}}
function agenda(){
  const L=[];
  if(S.diaRec)L.push({t:'Recebo a renda',day:S.diaRec,ok:1});
  S.card.forEach(c=>{if(c.f)L.push({t:'Fecha a fatura · '+c.n,day:c.f});if(c.d)L.push({t:'Vence a fatura · '+c.n,day:c.d,w:1})});
  S.loan.forEach(l=>{if(l.d)L.push({t:'Vence a parcela · '+l.n,day:l.d,w:1})});
  return L.map(x=>({...x,...nxt(x.day)})).sort((a,b)=>a.n-b.n);
}
const inN=n=>n===0?'hoje':n===1?'amanhã':'em '+n+' dias';
const cards=()=>sum(S.card,c=>c.v);
const parc=()=>sum(S.loan,l=>l.p);
const parM=o=>o>=1?sum(S.par.filter(x=>x.m===ym(o)),x=>x.v):0;
const parTot=()=>sum(S.par.filter(x=>x.m>=ym(1)),x=>x.v);
const cpx=c=>{const L=S.par.filter(x=>x.k===c.id&&x.m>=ym(1));return L.length?`<div class="m">+ ${R(sum(L,x=>x.v))} em parcelas futuras (${L.length} ${L.length===1?'mês':'meses'})</div>`:''};
const cardPay=()=>sum(S.card,c=>Math.max(c.v*.15,Math.min(50,c.v)));
const total=()=>fixed()+cardPay()+parc();

function sim(ex){
  const D=[...S.card.map(c=>({n:c.n,b:c.v,r:c.j,card:1})),...S.loan.map(l=>({n:l.n,b:l.s>0?l.s:(l.j>0?l.p*(1-Math.pow(1+l.j/100,-l.q))/(l.j/100):l.p*l.q),r:l.j,m:l.p,q:l.q}))].filter(d=>d.b>0).sort((a,b)=>b.r-a.r);
  let months=0,int=0,def=0,B0=0,m0=0;
  while(D.some(d=>d.b>.01)&&months<360){
    const o=months;months++;
    const B=S.renda+extraIn(o)-fixed(o)-parM(o)+ex;let left=B,need=0;
    D.forEach(d=>{if(d.b<=.01)return;const i=d.b*d.r/100;d.b+=i;int+=i;const m=(d.card||!(d.q>0))?Math.max(d.b*.15,Math.min(50,d.b)):d.m;const mm=Math.min(d.b,m);need+=mm;const p=Math.min(mm,Math.max(left,0));d.b-=p;left-=p;if(!d.card&&d.q>0&&p>=mm-.01)d.q--;if(months===1)m0+=p;});
    if(months===1)B0=B;
    if(need>B+.01&&!def)def=months;
    if(left>0)D.filter(d=>d.b>.01).sort((a,b)=>b.r-a.r).forEach(d=>{const p=Math.min(d.b,left);d.b-=p;left-=p;});
    D.forEach(d=>{if(d.b<=.01&&!d.done)d.done=months});
  }
  return{months,int,B:B0,mins:m0,deficit:def>0,defMonth:def,ok:months<360,D,none:D.length===0};
}
function when(m){const d=new Date();d.setMonth(d.getMonth()+m);return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}

function view(){
  applyTheme();const a=document.getElementById('app');
  document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';E=null;view();scrollTo(0,0)">${t[2]}</button>`).join('');
  a.innerHTML=({res:vRes,gas:vGas,ext:vExt,div:vDiv,pla:vPla})[tab]();
  const fresh=tab!==last;last=tab;a.classList.toggle('in',fresh);
  if(fresh){[...a.children].forEach((e,i)=>e.style.setProperty('--i',i));count(a)}
}
function count(a){a.querySelectorAll('[data-n],[data-t]').forEach(el=>{const m=el.dataset.n!==undefined,v=+(m?el.dataset.n:el.dataset.t);const f=x=>m?R(x):'T−'+Math.round(x);const t0=performance.now();const st=n=>{const k=Math.min(1,(n-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=f(v*e);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
const msg=t=>{const e=document.getElementById('bkm');if(e)e.textContent=t};
async function bk(){const j=JSON.stringify(S);try{await navigator.clipboard.writeText(j);msg('Backup copiado. Cole em suas notas ou envie para você mesmo.')}catch(e){document.getElementById('bkt').value=j;document.getElementById('bkt').closest('details').open=true;msg('Copie o texto do campo acima.')}}
function rs(){try{const o=JSON.parse(T('bkt'));if(!Array.isArray(o.desp))throw 0;S=Object.assign(DEF(),o);fixIds();save();view();}catch(e){msg('Backup inválido. Cole o texto completo.')}}

function vRes(){
  const ex=extraIn(0),t=total(),base=S.renda+ex,sob=base-t,f=fixed(),c=cardPay(),p=parc();
  const w=v=>t>0?(v/Math.max(t,base)*100).toFixed(1):0;
  return `<h1>Resumo do mês</h1>
  <div class="c"><div class="m">Gasto previsto no mês (cartão no mínimo)</div><div class="big" data-n="${t}">${R(t)}</div>
  <div class="bar"><i style="width:${w(f)}%;background:var(--ink)"></i><i style="width:${w(c)}%;background:var(--ac)"></i><i style="width:${w(p)}%;background:var(--mute)"></i></div>
  <div class="lg"><span><b style="background:var(--ink)"></b>Despesas ${R(f)}</span><span><b style="background:var(--ac)"></b>Cartões (mín.) ${R(c)}</span><span><b style="background:var(--mute)"></b>Empréstimos ${R(p)}</span></div></div>
  <div class="c"><label for="renda" style="margin-top:0">Renda mensal líquida (R$)</label>
  <input id="renda" class="money" inputmode="numeric" value="${S.renda?fm2(S.renda):''}" placeholder="0,00" onchange="S.renda=NM('renda');save();view()">
  <label for="drec">Dia do mês que eu recebo</label>
  <input id="drec" inputmode="numeric" maxlength="2" placeholder="Ex.: 5" ${dayIn(S.diaRec)} onchange="S.diaRec=DD('drec');save();view()">
  ${ex>0?`<div class="row" style="margin-top:10px"><span>Dinheiro extra neste mês</span><b class="ok">+ ${R(ex)}</b></div>`:''}
  <div class="row" style="margin-top:10px"><span>Sobra (ou falta) no fim do mês</span><b class="${sob>=0?'ok':'bad'}">${R(sob)}</b></div>
  ${S.par.length?`<div class="row"><span class="m">Parcelas futuras nos cartões</span><b>${R(parTot())}</b></div>`:''}
  <div class="row"><span class="m">Comprometimento da renda</span><b>${base>0?Math.round(t/base*100)+'%':'–'}</b></div></div>
  ${base>0&&sob<0?`<div class="tip w">Você vai fechar o mês com <b>${R(-sob)}</b> a menos do que precisa. Veja o plano para saber o que cortar ou renegociar.</div>`:''}
  ${t===0?`<div class="tip">Comece cadastrando suas despesas em <b>Gastos</b> e suas faturas e empréstimos em <b>Dívidas</b>.</div>`:''}
  ${(()=>{const A=agenda();return A.length?`<h2>Próximas datas</h2><div class="c">${A.map(x=>`<div class="row"><div>${x.t}<div class="m">dia ${x.day} · ${x.d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div></div><b class="${x.ok?'ok':x.w&&x.n<=3?'bad':''}">${inN(x.n)}</b></div>`).join('')}</div>`:''})()}
  <button class="btn" onclick="tab='pla';view()">Ver plano para zerar as dívidas</button>
  <details class="bk"${Y.tok?' open':''}><summary>Sincronizar aparelhos</summary>
  <div style="padding-top:14px">${Y.tok?`<div class="m">Conectado. As alterações são enviadas e baixadas automaticamente entre os seus aparelhos.</div>
  <div class="g2"><button class="btn" onclick="sync(true)">Sincronizar agora</button><button class="btn" onclick="if(confirm('Desconectar este aparelho? Os dados dele continuam aqui.'))disc()">Desconectar</button></div>`:`<div class="m">Mantém o celular e o tablet iguais, usando um espaço privado na sua conta do GitHub.</div>
  <div class="m" style="margin-top:10px">1. <a href="https://github.com/settings/tokens/new?scopes=gist&description=Zera%20D%C3%ADvidas" target="_blank" rel="noopener" style="color:var(--ac)">Criar o token</a> (em Expiration escolha "No expiration", role e confirme, copie o token).<br>2. Cole abaixo e toque em Conectar.<br>3. No outro aparelho, use o mesmo token.</div>
  <label for="syt">Token do GitHub</label><input id="syt" type="password" autocomplete="off" placeholder="ghp_…">
  <button class="btn" onclick="conn()">Conectar</button>`}
  <div class="m" id="sym" style="margin-top:12px">${esc(sm)}</div></div></details>
  <details class="bk"><summary>Backup dos dados</summary>
  <div style="padding-top:14px"><div class="m">Seus dados ficam salvos neste aparelho. Copie um backup para não perder se limpar o navegador ou trocar de celular.</div>
  <textarea id="bkt" placeholder="Cole aqui um backup para restaurar"></textarea>
  <div class="g2"><button class="btn" onclick="bk()">Copiar backup</button><button class="btn" onclick="rs()">Restaurar</button></div>
  <div class="m" id="bkm" style="margin-top:12px"></div></div></details>`;
}
function vGas(){
  const cur=ym(0),e=ed('desp')||{};
  return `<h1>Despesas do mês</h1>
  <div class="c">${S.desp.length?S.desp.map((d,i)=>`<div class="row ${act(d,0)?'':'off'}"><div>${esc(d.n)}<div class="m">${d.t==='f'?'Fixa':'Variável'} · ${d.ate?(d.ate<cur?'encerrada em '+fm(d.ate):'até '+fm(d.ate)):'sem data final'}</div></div><div><b>${R(d.v)}</b>${ebtn('desp',i)}<button class="x" aria-label="Remover" onclick="S.desp.splice(${i},1);E=null;save();view()">×</button></div></div>`).join('')+`<div class="row"><b>Total neste mês</b><b>${R(fixed())}</b></div>`:'<div class="m">Nenhuma despesa ainda. Adicione aluguel, mercado, luz, transporte…</div>'}</div>
  <div class="c" id="f-desp">${ttl('desp','Editando despesa','Nova despesa')}<label for="dn">Nome</label><input id="dn" placeholder="Ex.: Aluguel" value="${esc(e.n)}">
  <div class="g2"><div><label for="dv">Valor (R$)</label><input id="dv" class="money" inputmode="numeric" placeholder="0,00" value="${e.v?fm2(e.v):''}"></div>
  <div><label for="dt">Tipo</label><select id="dt"><option value="f" ${e.t!=='v'?'selected':''}>Fixa</option><option value="v" ${e.t==='v'?'selected':''}>Variável</option></select></div></div>
  <label>Termina em (opcional)</label>${mp('da',e.ate,1)}
  <div class="m" style="margin-top:8px">Deixe "—" se a despesa não tem data para acabar.</div>
  ${btns('desp','Adicionar despesa')}</div>`;
}
function addD(){const n=T('dn'),v=NM('dv');if(!n||v<=0)return;put('desp',{n,v,t:document.getElementById('dt').value,ate:gp('da')})}
function vExt(){
  const L=S.ext.map((x,i)=>({...x,i})).sort((a,b)=>a.m<b.m?-1:1),cur=ym(0),e=ed('ext')||{};
  return `<h1>Dinheiro extra</h1>
  <div class="c">${L.length?L.map(x=>`<div class="row ${x.m<cur?'off':''}"><div>${esc(x.n)}<div class="m">${x.m<cur?'recebido em ':'previsto para '}${fm(x.m)}</div></div><div><b class="ok">+ ${R(x.v)}</b>${ebtn('ext',x.i)}<button class="x" aria-label="Remover" onclick="S.ext.splice(${x.i},1);E=null;save();view()">×</button></div></div>`).join('')+`<div class="row"><b>Total a receber</b><b class="ok">${R(sum(L.filter(x=>x.m>=cur),x=>x.v))}</b></div>`:'<div class="m">Nenhum valor extra cadastrado. Inclua 13º, bônus, restituição, venda de algo…</div>'}</div>
  <div class="c" id="f-ext">${ttl('ext','Editando dinheiro extra','Novo dinheiro extra')}<label for="en">Origem</label><input id="en" placeholder="Ex.: 13º salário" value="${esc(e.n)}">
  <label for="ev">Valor (R$)</label><input id="ev" class="money" inputmode="numeric" placeholder="0,00" value="${e.v?fm2(e.v):''}">
  <label>Mês que recebe</label>${mp('em',e.m||cur,0)}
  ${btns('ext','Adicionar dinheiro extra')}</div>
  <p class="m">O valor entra na renda do mês escolhido e é usado no plano para quitar a dívida mais cara.</p>`;
}
function addE(){const n=T('en'),v=NM('ev'),m=gp('em');if(!n||v<=0||!m)return;put('ext',{n,v,m})}
function vDiv(){
  const c=ed('card')||{},l=ed('loan')||{};
  return `<h1>Cartões e empréstimos</h1>
  <h2>Cartões de crédito</h2>
  <div class="c">${S.card.length?S.card.map((x,i)=>`<div class="row"><div>${esc(x.n)}<div class="m">juros ${x.j}% ao mês${x.f?' · fecha dia '+x.f:''}${x.d?' · vence dia '+x.d:''}</div>${cpx(x)}</div><div><b>${R(x.v)}</b>${ebtn('card',i)}<button class="x" aria-label="Remover" onclick="rmC(${i})">×</button></div></div>`).join(''):'<div class="m">Nenhum cartão cadastrado.</div>'}</div>
  <div class="c" id="f-card">${ttl('card','Editando cartão','Novo cartão')}<label for="cn">Nome do cartão</label><input id="cn" placeholder="Ex.: Nubank" value="${esc(c.n)}">
  <div class="g2"><div><label for="cv">Fatura atual (R$)</label><input id="cv" class="money" inputmode="numeric" placeholder="0,00" value="${c.v?fm2(c.v):''}"></div>
  <div><label for="cj">Juros rotativo (% mês)</label><input id="cj" inputmode="decimal" value="${c.j!=null?c.j:14}"></div>
  <div><label for="cf">Dia que fecha a fatura</label><input id="cf" inputmode="numeric" maxlength="2" placeholder="Ex.: 25" ${dayIn(c.f)}></div>
  <div><label for="cd">Dia do vencimento</label><input id="cd" inputmode="numeric" maxlength="2" placeholder="Ex.: 5" ${dayIn(c.d)}></div></div>
  ${btns('card','Adicionar cartão')}</div>
  ${vPar()}
  <h2>Empréstimos e financiamentos</h2>
  <div class="c">${S.loan.length?S.loan.map((x,i)=>`<div class="row"><div>${esc(x.n)}<div class="m">${x.q} parcelas · juros ${x.j}% ao mês${x.s>0?' · saldo '+R(x.s):''}${x.d?' · vence dia '+x.d:''}</div></div><div><b>${R(x.p)}</b>${ebtn('loan',i)}<button class="x" aria-label="Remover" onclick="S.loan.splice(${i},1);E=null;save();view()">×</button></div></div>`).join(''):'<div class="m">Nenhum empréstimo cadastrado.</div>'}</div>
  <div class="c" id="f-loan">${ttl('loan','Editando empréstimo','Novo empréstimo')}<label for="ln">Nome</label><input id="ln" placeholder="Ex.: Empréstimo pessoal" value="${esc(l.n)}">
  <div class="g2"><div><label for="lp">Parcela mensal (R$)</label><input id="lp" class="money" inputmode="numeric" placeholder="0,00" value="${l.p?fm2(l.p):''}"></div>
  <div><label for="lq">Parcelas restantes</label><input id="lq" inputmode="numeric" placeholder="12" value="${l.q||''}"></div>
  <div><label for="lj">Juros (% mês)</label><input id="lj" inputmode="decimal" value="${l.j!=null?l.j:4}"></div>
  <div><label for="ls">Saldo devedor (opcional)</label><input id="ls" class="money" inputmode="numeric" placeholder="0,00" value="${l.s?fm2(l.s):''}"></div>
  <div><label for="ld">Dia do vencimento</label><input id="ld" inputmode="numeric" maxlength="2" placeholder="Ex.: 10" ${dayIn(l.d)}></div></div>
  ${btns('loan','Adicionar empréstimo')}</div>`;
}
function addC(){const n=T('cn'),v=NM('cv'),j=N('cj');if(!n||v<=0)return;const o=ed('card');put('card',{n,v,j,f:DD('cf'),d:DD('cd'),id:(o&&o.id)||'c'+Date.now().toString(36)})}
function rmC(i){const id=S.card[i].id;S.par=S.par.filter(x=>x.k!==id);S.card.splice(i,1);E=null;save();view()}
function addP(){const m=gp('pm'),v=NM('pv'),k=(document.getElementById('pk')||{}).value;if(!m||v<=0||!k)return;
  if(!ed('par')){const i=S.par.findIndex(x=>x.k===k&&x.m===m);if(i>=0)E={k:'par',i}}
  put('par',{k,m,v})}
function vPar(){
  const p=ed('par')||{},cn=id=>{const c=S.card.find(x=>x.id===id);return c?c.n:'—'},c1=ym(1);
  const L=S.par.map((x,i)=>({...x,i})).filter(x=>x.m>=c1).sort((a,b)=>a.m<b.m?-1:a.m>b.m?1:cn(a.k)<cn(b.k)?-1:1);
  const mons=[];if(L.length){let o=1;while(ym(o)<=L[L.length-1].m&&o<=36){mons.push(o);o++}}
  return `<h2>Parcelas futuras nos cartões</h2>
  <div class="c">${L.length?L.map(x=>`<div class="row"><div>${fm(x.m)}<div class="m">${esc(cn(x.k))}</div></div><div><b>${R(x.v)}</b>${ebtn('par',x.i)}<button class="x" aria-label="Remover" onclick="S.par.splice(${x.i},1);E=null;save();view()">×</button></div></div>`).join('')+`<div class="row"><b>Total já comprometido</b><b>${R(parTot())}</b></div>`:'<div class="m">Nenhuma parcela futura cadastrada.</div>'}</div>
  ${L.length?`<div class="c"><table><tr><th>Mês</th><th>Parcelas</th><th>Da renda</th></tr>${mons.map(o=>{const v=parM(o);return `<tr><td>${fm(ym(o))}</td><td>${R(v)}</td><td>${S.renda>0?Math.round(v/S.renda*100)+'%':'–'}</td></tr>`}).join('')}</table></div>`:''}
  ${S.card.length?`<div class="c" id="f-par">${ttl('par','Editando parcela do mês','Parcelas de um mês')}
  <label for="pk">Cartão</label><select id="pk">${S.card.map(c=>`<option value="${esc(c.id)}" ${c.id===p.k?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
  <label>Mês da fatura</label>${mp('pm',p.m||c1,0)}
  <label for="pv">Total de parcelas neste mês (R$)</label><input id="pv" class="money" inputmode="numeric" placeholder="0,00" value="${p.v?fm2(p.v):''}">
  <div class="m" style="margin-top:8px">Some o que já está comprometido naquele mês neste cartão. Se lançar o mesmo cartão e mês de novo, o valor é substituído.</div>
  ${btns('par','Adicionar mês')}</div>`:'<div class="m">Cadastre um cartão acima para lançar parcelas futuras.</div>'}`;
}
function addL(){const n=T('ln'),p=NM('lp'),q=Math.round(N('lq')),j=N('lj'),s=NM('ls');if(!n||p<=0||q<=0)return;put('loan',{n,p,q,j,s,d:DD('ld')})}
function vPla(){
  if(!S.card.length&&!S.loan.length)return `<h1>Plano para zerar</h1><div class="tip">Cadastre ao menos um cartão ou empréstimo em <b>Dívidas</b> para ver o plano.</div>`;
  const ex=S.extra||0,r=sim(ex),debts=[...r.D].sort((a,b)=>b.r-a.r);
  const tips=[];
  const worst=debts[0];
  if(S.renda<=0)tips.push(['w','Informe sua renda no Resumo para o plano calcular com precisão.']);
  if(r.deficit)tips.push(['w',`Em ${fm(ym(r.defMonth-1))} o que sobra após as despesas não cobre os pagamentos mínimos das dívidas (o que faltar fica em aberto e rende juros). Corte gastos variáveis ou renegocie as dívidas antes de qualquer outra coisa.`]);
  if(worst)tips.push(['',`Concentre qualquer dinheiro extra em <b>${worst.n}</b> (${worst.r}% ao mês), a dívida mais cara. Pague só o mínimo nas outras. Ao quitar, passe o valor para a próxima.`]);
  if(S.card.some(c=>c.j>=8))tips.push(['w','Nunca deixe fatura no rotativo. Se não conseguir pagar tudo, troque a dívida do cartão por um empréstimo ou parcelamento com juros bem menores.']);
  const varD=S.desp.filter(d=>d.t==='v'&&act(d,0));const vs=sum(varD,d=>d.v);
  if(vs>0)tips.push(['',`Cortar 20% das despesas variáveis libera <b>${R(vs*.2)}</b> por mês para as dívidas.`]);
  const big=[...S.loan].sort((a,b)=>b.j-a.j)[0];
  if(big&&big.j>=3)tips.push(['',`Peça portabilidade do <b>${big.n}</b> para outro banco com taxa menor e renegocie o saldo. Em feirões de renegociação os descontos podem ser altos.`]);
  const fe=S.ext.filter(e=>e.m>=ym(0));
  if(fe.length)tips.push(['',`Seu dinheiro extra (${R(sum(fe,e=>e.v))}) entra no plano no mês em que for recebido e vai direto para a dívida mais cara.`]);
  if(S.par.length)tips.push(['',`Você já tem <b>${R(parTot())}</b> em parcelas futuras nos cartões, descontadas do plano em cada mês. Evite novas compras parceladas até quitar.`]);
  const endD=S.desp.filter(d=>d.ate&&d.ate>=ym(0)).sort((a,b)=>a.ate<b.ate?-1:1)[0];
  if(endD)tips.push(['',`Quando <b>${endD.n}</b> terminar em ${fm(endD.ate)}, ${R(endD.v)} por mês ficam livres. O plano já usa esse valor.`]);
  tips.push(['','Venda itens parados e use renda extra pontual para amortizar o saldo. Antecipar parcelas reduz os juros futuros.']);
  tips.push(['','Evite novas compras no cartão até zerar. Pague a fatura inteira todo mês.']);
  const ext=[0,100,300,500].map(e=>[e,sim(e)]);
  return `<h1>Plano para zerar</h1>
  <div class="c"><div class="m">${r.ok?'Contagem regressiva':'Com a sua renda atual'}</div>
  ${r.ok?`<div class="big ok" data-t="${r.months}">T−${r.months}</div><div class="m" style="margin-top:6px">${r.months===1?'mês':'meses'} para dívida zero</div><div class="m">${when(r.months-1)} · juros totais estimados ${R(r.int)}</div>`:`<div class="big bad">Não fecha</div><div class="m">${r.deficit?'O orçamento não cobre os pagamentos mínimos.':'Mais de 30 anos para quitar nesse ritmo.'}</div>`}
  <label for="ex">Valor extra por mês para as dívidas (R$)</label>
  <input id="ex" class="money" inputmode="numeric" value="${ex?fm2(ex):''}" placeholder="0,00" onchange="S.extra=NM('ex');save();view()">
  <div class="row" style="margin-top:10px"><span class="m">Disponível este mês para dívidas</span><b>${R(r.B)}</b></div></div>
  <h2>Ordem de pagamento</h2>
  <div class="c">${debts.map((d,i)=>`<div class="row"><div>${i+1}. ${d.n}<div class="m">juros ${d.r}% ao mês</div></div><b>${d.done?'quita em '+d.done+(d.done===1?' mês':' meses'):'não quita'}</b></div>`).join('')}</div>
  <h2>O que fazer</h2>
  ${tips.map(t=>`<div class="tip ${t[0]}">${t[1]}</div>`).join('')}
  <h2>E se eu pagar mais por mês?</h2>
  <div class="c"><table><tr><th>Extra</th><th>Prazo</th><th>Juros</th></tr>${ext.map(([e,x])=>`<tr><td>+${R(e)}</td><td>${x.ok?x.months+' meses':'não fecha'}</td><td>${x.ok?R(x.int):'–'}</td></tr>`).join('')}</table></div>
  <p class="m">Estimativa simples: considera mínimo de 15% da fatura nos cartões e as parcelas dos empréstimos. As parcelas futuras dos cartões são descontadas do orçamento mês a mês. Não substitui orientação financeira.</p>`;
}
view();sync();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
